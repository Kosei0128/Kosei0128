<svg width="1000" height="420" viewBox="0 0 1000 420" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1000" y2="420" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#030406"/>
      <stop offset="0.45" stop-color="#07080b"/>
      <stop offset="1" stop-color="#020304"/>
    </linearGradient>
    <linearGradient id="nameGradient" x1="0" y1="0" x2="430" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#43f0c2"/>
      <stop offset="0.24" stop-color="#44a7ff"/>
      <stop offset="0.5" stop-color="#b16cff"/>
      <stop offset="0.75" stop-color="#ff6aa7"/>
      <stop offset="1" stop-color="#f3d66a"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-170 0;190 0;-170 0" dur="9s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="orbit" x1="520" y1="80" x2="905" y2="340" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#32f5c8" stop-opacity="0.08"/>
      <stop offset="0.32" stop-color="#38a9ff" stop-opacity="0.42"/>
      <stop offset="0.62" stop-color="#b169ff" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#ff5d9e" stop-opacity="0.1"/>
      <animateTransform attributeName="gradientTransform" type="rotate" values="0 710 210;360 710 210" dur="22s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="thread" x1="490" y1="280" x2="920" y2="90" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ff5c9f" stop-opacity="0.05"/>
      <stop offset="0.35" stop-color="#6e6cff" stop-opacity="0.36"/>
      <stop offset="0.68" stop-color="#3ce6c0" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#f7d76a" stop-opacity="0.07"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-60 0;70 0;-60 0" dur="12s" repeatCount="indefinite"/>
    </linearGradient>
    <radialGradient id="aura" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(730 215) rotate(90) scale(190 290)">
      <stop offset="0" stop-color="#63f0d1" stop-opacity="0.12"/>
      <stop offset="0.34" stop-color="#6b68ff" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <filter id="cardShadow" x="0" y="0" width="1000" height="420" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
    <filter id="blurWide" x="400" y="-60" width="600" height="540" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <filter id="blurSoft" x="420" y="-50" width="560" height="520" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" stroke="#ffffff" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
  </defs>

  <rect x="10" y="10" width="980" height="400" rx="34" fill="url(#bg)" stroke="#2c3037" stroke-width="3" filter="url(#cardShadow)"/>
  <rect x="10" y="10" width="980" height="400" rx="34" fill="url(#bg)"/>
  <rect x="12" y="12" width="976" height="396" rx="32" fill="url(#grid)" opacity="0.55"/>
  <rect x="12" y="12" width="976" height="396" rx="32" fill="url(#aura)"/>

  <path d="M52 365H390" stroke="#ffffff" stroke-opacity="0.055"/>
  <path d="M64 58H202" stroke="#67f2d5" stroke-opacity="0.22"/>

  <text x="64" y="103" fill="url(#nameGradient)" font-family="Segoe UI, Arial, sans-serif" font-size="54" font-weight="760">Kosvel</text>
  <text x="67" y="143" fill="#9ca0ab" font-family="Segoe UI, Arial, sans-serif" font-size="22">Web Developer / Indie Developer</text>

  <text x="67" y="204" fill="#d5d7de" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="600" opacity="0.86">Build</text>
  <text x="67" y="236" fill="#8f939f" font-family="Segoe UI, Arial, sans-serif" font-size="18">Web apps, landing pages, automation tools</text>

  <text x="67" y="284" fill="#d5d7de" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="600" opacity="0.86">Stack</text>
  <text x="67" y="316" fill="#8f939f" font-family="Segoe UI, Arial, sans-serif" font-size="18">Next.js / TypeScript / Python / AI APIs</text>

  <rect x="68" y="342" width="214" height="36" rx="8" fill="#0d0f13" stroke="#282d37" opacity="0.94"/>
  <text x="86" y="365" fill="#afb4c0" font-family="Segoe UI, Arial, sans-serif" font-size="15">Portfolio in progress</text>
  <path d="M244 360 C252 351 260 351 268 360 C260 369 252 369 244 360Z" fill="#54e8bd" opacity="0.9"/>

  <g filter="url(#blurWide)" opacity="0.9">
    <ellipse cx="710" cy="210" rx="198" ry="86" stroke="url(#orbit)" stroke-width="34" transform="rotate(-18 710 210)">
      <animate attributeName="opacity" values="0.28;0.62;0.38;0.56;0.28" dur="10s" repeatCount="indefinite"/>
    </ellipse>
    <path d="M500 266 C590 150 702 344 914 112" stroke="url(#thread)" stroke-width="30" stroke-linecap="round" opacity="0.58">
      <animate attributeName="opacity" values="0.28;0.55;0.34;0.48;0.28" dur="11s" repeatCount="indefinite"/>
    </path>
  </g>

  <g filter="url(#blurSoft)" opacity="0.82">
    <ellipse cx="710" cy="210" rx="196" ry="84" stroke="url(#orbit)" stroke-width="8" transform="rotate(-18 710 210)">
      <animate attributeName="opacity" values="0.36;0.72;0.44;0.66;0.36" dur="8s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="710" cy="210" rx="128" ry="58" stroke="#ffffff" stroke-opacity="0.035" stroke-width="2" transform="rotate(22 710 210)"/>
    <path d="M502 266 C590 150 702 344 914 112" stroke="url(#thread)" stroke-width="7" stroke-linecap="round">
      <animate attributeName="opacity" values="0.44;0.82;0.52;0.72;0.44" dur="9s" repeatCount="indefinite"/>
    </path>
  </g>

  <g opacity="0.9">
    <circle cx="644" cy="166" r="4" fill="#46f0c8">
      <animate attributeName="opacity" values="0.35;1;0.35" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="759" cy="249" r="5" fill="#7f77ff">
      <animate attributeName="opacity" values="0.25;0.9;0.25" dur="5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="830" cy="145" r="3" fill="#ff70ad">
      <animate attributeName="opacity" values="0.2;0.85;0.2" dur="6s" repeatCount="indefinite"/>
    </circle>
  </g>

  <rect x="12" y="12" width="976" height="396" rx="32" stroke="#ffffff" stroke-opacity="0.045"/>
</svg>