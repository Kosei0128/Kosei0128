<svg width="1000" height="420" viewBox="0 0 1000 420" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1000" y2="420" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#020407"/>
      <stop offset="0.5" stop-color="#060811"/>
      <stop offset="1" stop-color="#020306"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(775 190) rotate(90) scale(250 360)">
      <stop offset="0" stop-color="#22f2c8" stop-opacity="0.20"/>
      <stop offset="0.38" stop-color="#5c7cff" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(640 285) rotate(90) scale(180 280)">
      <stop offset="0" stop-color="#ff4ea3" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="name" x1="40" y1="0" x2="430" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5cf2d6"/>
      <stop offset="0.24" stop-color="#5ab0ff"/>
      <stop offset="0.52" stop-color="#9c6dff"/>
      <stop offset="0.78" stop-color="#ff67a8"/>
      <stop offset="1" stop-color="#f8d76a"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-180 0;170 0;-180 0" dur="8s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="signal" x1="485" y1="305" x2="930" y2="70" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ff4ea3" stop-opacity="0.12"/>
      <stop offset="0.28" stop-color="#8970ff" stop-opacity="0.46"/>
      <stop offset="0.58" stop-color="#42b5ff" stop-opacity="0.36"/>
      <stop offset="1" stop-color="#56f2ca" stop-opacity="0.14"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-80 0;80 0;-80 0" dur="11s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="kstroke" x1="600" y1="80" x2="890" y2="335" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#62ffe0" stop-opacity="0.86"/>
      <stop offset="0.45" stop-color="#5b81ff" stop-opacity="0.62"/>
      <stop offset="1" stop-color="#ff4ea3" stop-opacity="0.72"/>
      <animateTransform attributeName="gradientTransform" type="rotate" values="0 750 210;360 750 210" dur="18s" repeatCount="indefinite"/>
    </linearGradient>
    <filter id="shadow" x="0" y="0" width="1000" height="420" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#000" flood-opacity="0.65"/>
    </filter>
    <filter id="blur" x="410" y="-80" width="590" height="560" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <filter id="soft" x="470" y="-50" width="500" height="520" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0V34" stroke="#ffffff" stroke-opacity="0.03"/>
    </pattern>
  </defs>

  <rect x="10" y="10" width="980" height="400" rx="34" fill="url(#bg)" stroke="#242a35" stroke-width="3" filter="url(#shadow)"/>
  <rect x="11" y="11" width="978" height="398" rx="33" fill="url(#bg)"/>
  <rect x="12" y="12" width="976" height="396" rx="32" fill="url(#grid)" opacity="0.7"/>
  <rect x="12" y="12" width="976" height="396" rx="32" fill="url(#glowA)"/>
  <rect x="12" y="12" width="976" height="396" rx="32" fill="url(#glowB)"/>

  <path d="M70 62H230" stroke="#6fffe0" stroke-opacity="0.18"/>
  <text x="70" y="115" fill="url(#name)" font-family="Segoe UI, Arial, sans-serif" font-size="70" font-weight="800">Kosvel</text>
  <text x="74" y="156" fill="#b4c0d4" font-family="Segoe UI, Arial, sans-serif" font-size="23">Web Developer / Indie Builder</text>
  <text x="74" y="210" fill="#dce6f7" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="650">Small tools, real value.</text>
  <text x="74" y="244" fill="#8f9bad" font-family="Segoe UI, Arial, sans-serif" font-size="18">I design and build practical web products, LPs, and automation workflows.</text>

  <g font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#c7d2e5">
    <rect x="74" y="286" width="85" height="34" rx="17" fill="#0c1018" stroke="#263141"/>
    <text x="96" y="308">Next.js</text>
    <rect x="169" y="286" width="108" height="34" rx="17" fill="#0c1018" stroke="#263141"/>
    <text x="191" y="308">TypeScript</text>
    <rect x="287" y="286" width="78" height="34" rx="17" fill="#0c1018" stroke="#263141"/>
    <text x="310" y="308">Python</text>
    <rect x="375" y="286" width="78" height="34" rx="17" fill="#0c1018" stroke="#263141"/>
    <text x="397" y="308">AI APIs</text>
  </g>

  <rect x="74" y="346" width="240" height="34" rx="8" fill="#0b0f17" stroke="#273244"/>
  <circle cx="96" cy="363" r="5" fill="#5cf2d6">
    <animate attributeName="opacity" values="0.35;1;0.35" dur="2.6s" repeatCount="indefinite"/>
  </circle>
  <text x="112" y="368" fill="#aebbd0" font-family="Segoe UI, Arial, sans-serif" font-size="15">Portfolio under construction</text>

  <g filter="url(#blur)" opacity="0.9">
    <path d="M552 292 C632 166 735 336 916 108" stroke="url(#signal)" stroke-width="36" stroke-linecap="round">
      <animate attributeName="opacity" values="0.24;0.58;0.32;0.5;0.24" dur="9s" repeatCount="indefinite"/>
    </path>
    <path d="M640 86 V326" stroke="url(#kstroke)" stroke-width="30" stroke-linecap="round" opacity="0.62"/>
    <path d="M640 220 L858 86" stroke="url(#kstroke)" stroke-width="30" stroke-linecap="round" opacity="0.52"/>
    <path d="M640 220 L878 324" stroke="url(#kstroke)" stroke-width="30" stroke-linecap="round" opacity="0.5"/>
  </g>

  <g filter="url(#soft)">
    <path d="M548 292 C632 166 735 336 916 108" stroke="url(#signal)" stroke-width="7" stroke-linecap="round">
      <animate attributeName="opacity" values="0.38;0.82;0.46;0.72;0.38" dur="8s" repeatCount="indefinite"/>
    </path>
    <path d="M640 86 V326" stroke="url(#kstroke)" stroke-width="8" stroke-linecap="round"/>
    <path d="M640 220 L858 86" stroke="url(#kstroke)" stroke-width="8" stroke-linecap="round"/>
    <path d="M640 220 L878 324" stroke="url(#kstroke)" stroke-width="8" stroke-linecap="round"/>
  </g>

  <circle cx="760" cy="126" r="4" fill="#5cf2d6"><animate attributeName="opacity" values="0.25;1;0.25" dur="4s" repeatCount="indefinite"/></circle>
  <circle cx="838" cy="260" r="5" fill="#8b7aff"><animate attributeName="opacity" values="0.2;0.9;0.2" dur="5s" repeatCount="indefinite"/></circle>
  <circle cx="902" cy="163" r="3" fill="#ff67a8"><animate attributeName="opacity" values="0.25;0.85;0.25" dur="6s" repeatCount="indefinite"/></circle>

  <rect x="12" y="12" width="976" height="396" rx="32" stroke="#ffffff" stroke-opacity="0.045"/>
</svg>